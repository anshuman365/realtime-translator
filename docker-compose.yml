version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./translation_app.db
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=changeme123
      - SECRET_KEY=your-secret-key-change-in-production
    volumes:
      - ./backend:/app
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - translator-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - translator-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  translator-network:
    driver: bridge

volumes:
  models:
  logs:
